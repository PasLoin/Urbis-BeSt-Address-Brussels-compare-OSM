name: Release from changelog

on:
  push:
    branches: [main]
    paths:
      - "changelog.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-from-changelog
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract latest changelog entry
        id: changelog
        run: |
          set -euo pipefail

          date="$(grep -m1 -oP '^## \K[0-9]{4}-[0-9]{2}-[0-9]{2}' changelog.md)"
          if [ -z "$date" ]; then
            echo "Aucune entrée datée trouvée dans changelog.md" >&2
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"

          awk '/^## /{c++; if (c==2) exit; next} c==1' changelog.md > release-notes.md

      - name: Skip if release already exists
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.changelog.outputs.date }}" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.changelog.outputs.date }} déjà existante, rien à faire."
          fi

      - name: Create tag and release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.changelog.outputs.date }}" \
            --title "v${{ steps.changelog.outputs.date }}" \
            --notes-file release-notes.md \
            --latest
