name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'js/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
