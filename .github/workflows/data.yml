name: Data
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data
  cancel-in-progress: false
jobs:
  data:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tippecanoe osmium-tool libosmium2-dev libgdal-dev g++ python3-dev

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install geopandas pyogrio osmium shapely -r requirements-dev.txt

      - name: Fetch sources and generate tiles
        run: python3 fetch-latest.py

      - name: Build search index
        run: python3 build-search-index.py brussels_capital_region-latest.osm.pbf

      - name: Validate data
        env:
          DATA_DIR: .
        run: python3 -m pytest tests/test_data.py -v

      - name: Publish to release data-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data-latest >/dev/null 2>&1; then
            gh release create data-latest \
              --title "Données UrbIS / OSM (dernière version valide)" \
              --notes "Publiée automatiquement par data.yml après validation. Ne pas modifier à la main." \
              --prerelease \
              --latest=false
          fi
          gh release upload data-latest addresses.pmtiles search-index.json version.json --clobber

      - name: Keep rejected data for inspection
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: data-rejected-${{ github.run_id }}
          path: |
            version.json
            search-index.json
          if-no-files-found: ignore
          retention-days: 7
