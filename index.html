<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adresses manquantes dans OpenStreetMap à Bruxelles (UrbIS)</title>
  <meta name="description" content="Carte des adresses officielles UrbIS de la Région de Bruxelles-Capitale comparées à OpenStreetMap. Repérez les adresses manquantes et corrigez-les dans JOSM.">
  <link rel="canonical" href="https://pasloin.github.io/Urbis-BeSt-Address-Brussels-compare-OSM/">
  <meta name="theme-color" content="#1a3a8f">
  <link rel="icon" href="assets/img/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="UrbIS vs OSM Bruxelles">
  <meta property="og:locale" content="fr_BE">
  <meta property="og:url" content="https://pasloin.github.io/Urbis-BeSt-Address-Brussels-compare-OSM/">
  <meta property="og:title" content="Adresses de Bruxelles : UrbIS comparé à OpenStreetMap">
  <meta property="og:description" content="Carte des adresses officielles de Bruxelles-Capitale absentes d’OpenStreetMap, avec liens Mapillary, Panoramax et JOSM. Données mises à jour chaque jour.">
  <meta property="og:image" content="https://pasloin.github.io/Urbis-BeSt-Address-Brussels-compare-OSM/assets/img/cecinestpasunerue.png">
  <meta property="og:image:width" content="962">
  <meta property="og:image:height" content="430">
  <meta property="og:image:alt" content="Plaque de rue bruxelloise bleue avec l’inscription « Ceci n’est pas une rue »">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "UrbIS vs OSM Bruxelles",
    "alternateName": "Urbis-BeSt-Address-Brussels-compare-OSM",
    "url": "https://pasloin.github.io/Urbis-BeSt-Address-Brussels-compare-OSM/",
    "description": "Carte des adresses officielles UrbIS de la Région de Bruxelles-Capitale comparées à OpenStreetMap pour repérer les adresses manquantes.",
    "inLanguage": "fr",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Web",
    "isAccessibleForFree": true,
    "license": "https://opensource.org/licenses/MIT",
    "spatialCoverage": {
      "@type": "Place",
      "name": "Région de Bruxelles-Capitale"
    },
    "author": {
      "@type": "Person",
      "name": "PasLoin"
    }
  }
  </script>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="map"></div>
<button id="lasso-btn" title="Sélection lasso">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 22a5 5 0 0 1-2-4"/>
    <path d="M7 16.93c.96.43 1.96.74 2.99.91"/>
    <path d="M3.34 14A6.8 6.8 0 0 1 2 10c0-4.42 4.48-8 10-8s10 3.58 10 8a7.19 7.19 0 0 1-.33 2"/>
    <path d="M5 18a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
    <path d="M14.33 22h-.09a.35.35 0 0 1-.24-.32v-10a.34.34 0 0 1 .56-.27l6.08 5.18a.36.36 0 0 1-.04.57l-2.72 1.33"/>
    <path d="M17.73 19.4 21 23"/>
  </svg>
  Lasso
</button>
<div id="lasso-panel">
  <strong id="lasso-count">0</strong> adresse(s) sélectionnée(s)
  <br>
  <button id="lasso-export">Exporter .osm</button>
  <button id="lasso-cancel">Annuler</button>
</div>
<div id="search-control">
  <div id="search-bar">
    <button id="search-toggle" title="Rechercher une adresse" aria-label="Rechercher une adresse">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>
    <input id="search-input" type="text"
           placeholder="Rue… numéro optionnel"
           autocomplete="off" spellcheck="false"
           aria-label="Recherche d'adresse">
    <button id="search-clear" title="Effacer" aria-label="Effacer">&times;</button>
    <div id="search-src-pill">
      <button class="src-btn active" data-src="osm">OSM</button>
      <button class="src-btn"        data-src="urbis">UrbIS</button>
    </div>
  </div>
  <ul id="search-dropdown" role="listbox"></ul>
</div>
<div id="basemap-control">
  <button id="basemap-toggle" title="Fond de carte" aria-label="Fond de carte" aria-expanded="false" aria-controls="basemap-menu">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
      <path d="M12 3 2 8l10 5 10-5-10-5Z" fill="#fff"/>
      <path d="m2 12 10 5 10-5"/>
      <path d="m2 16 10 5 10-5"/>
    </svg>
  </button>
  <div id="basemap-menu" role="radiogroup" aria-label="Fond de carte"></div>
</div>
<div id="copy-toast">ID copié !</div>
<details id="panel" open>
  <summary>Filtres <span class="toggle-arrow"></span></summary>
  <div id="filters"></div>
  <div id="stats">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="stats-rows" id="stats-rows"></div>
  </div>
  <div id="versions">
    <div>UrbIS : <span id="urbis-date">…</span></div>
    <div>OSM : <span id="osm-date">…</span></div>
  </div>
</details>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
